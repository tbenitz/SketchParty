name: Build Android TV APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'style.css'
      - 'js/**'
      - 'words.json'
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out SketchParty
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java for Capacitor 7
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Bundle local web application
        run: npm run build

      - name: Generate native Android project
        run: npx cap add android

      - name: Enable standard and Android TV launcher entries
        run: node scripts/patch-android.mjs

      - name: Sync embedded game assets
        run: npx cap sync android

      - name: Build installable debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare download
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SketchParty-AndroidTV-debug.apk

      - name: Upload completed APK
        uses: actions/upload-artifact@v4
        with:
          name: SketchParty-AndroidTV-APK
          path: SketchParty-AndroidTV-debug.apk
          if-no-files-found: error
          retention-days: 30
