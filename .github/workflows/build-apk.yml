name: Build Host APK

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build APK with Capacitor
        uses: cemcoe/web-to-apk-action@v1
        with:
          app_name: "SketchParty"
          app_id: "com.tbenitz.sketchparty"
          build_command: "echo 'static site'"
          web_dir: "."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SketchParty-host-apk
          path: "*.apk"
