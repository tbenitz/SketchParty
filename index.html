<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>SketchParty — Draw</title>
  <script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #111;
      color: #fff;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      touch-action: none;
      overflow: hidden;
    }
    header {
      padding: 8px 12px;
      background: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }
    h1 { font-size: 1rem; font-weight: 600; }
    .tools { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    button, input[type="color"], input[type="text"] {
      background: #2a2a2a;
      border: 1px solid #444;
      color: #fff;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
    }
    button.active { background: #3b82f6; border-color: #3b82f6; }
    canvas { flex: 1; background: #fff; touch-action: none; }
    .join-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      gap: 12px;
      text-align: center;
    }
    .join-screen input { width: 220px; font-size: 1.2rem; text-align: center; letter-spacing: 2px; }
  </style>
</head>
<body>
  <header>
    <h1>SketchParty</h1>
    <div class="tools" id="tools" style="display:none;">
      <button id="pen" class="active">Pen</button>
      <button id="eraser">Eraser</button>
      <button id="clear">Clear</button>
      <input type="color" id="color" value="#000000">
      <input type="range" id="size" min="2" max="20" value="6">
    </div>
  </header>

  <div class="join-screen" id="joinScreen">
    <h2>Join a game</h2>
    <p style="opacity:.7;">Scan the QR on the TV or enter the code.</p>
    <input id="nameInput" placeholder="Your name" value="Player">
    <input id="codeInput" placeholder="CODE" maxlength="6" style="text-transform:uppercase;">
    <button id="joinBtn">Join</button>
    <p id="joinError" style="color:#f87171;"></p>
  </div>

  <canvas id="canvas" style="display:none;"></canvas>

  <script type="module">
    import { joinAsPlayer, sendStroke, sendClear } from "./js/game.js";

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const joinScreen = document.getElementById("joinScreen");
    const tools = document.getElementById("tools");

    let drawing = false;
    let tool = "pen";
    let color = "#000000";
    let size = 6;
    let currentPoints = [];

    function resize() {
      const header = document.querySelector("header");
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight - header.offsetHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    // Auto-fill from QR (?room=CODE)
    const params = new URLSearchParams(location.search);
    const urlCode = params.get("room");
    if (urlCode) document.getElementById("codeInput").value = urlCode;

    document.getElementById("joinBtn").onclick = () => {
      const name = document.getElementById("nameInput").value || "Player";
      const code = document.getElementById("codeInput").value;
      if (!code) {
        document.getElementById("joinError").textContent = "Enter a room code.";
        return;
      }

      joinAsPlayer(
        code,
        name,
        () => {
          joinScreen.style.display = "none";
          canvas.style.display = "block";
          tools.style.display = "flex";
        },
        (data) => {
          if (data.type === "clear") {
            ctx.fillStyle = "#fff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            return;
          }
          drawRemoteStroke(data);
        },
        () => {}
      );
    };

    function getNormPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: (clientX - rect.left) / canvas.width,
        y: (clientY - rect.top) / canvas.height
      };
    }

    function start(e) {
      e.preventDefault();
      drawing = true;
      currentPoints = [getNormPos(e)];
      ctx.beginPath();
      const p = currentPoints[0];
      ctx.moveTo(p.x * canvas.width, p.y * canvas.height);
    }

    function draw(e) {
      if (!drawing) return;
      e.preventDefault();
      const p = getNormPos(e);
      currentPoints.push(p);
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.lineWidth = tool === "eraser" ? size * 3 : size;
      ctx.strokeStyle = tool === "eraser" ? "#ffffff" : color;
      ctx.lineTo(p.x * canvas.width, p.y * canvas.height);
      ctx.stroke();
    }

    function end() {
      if (!drawing || currentPoints.length < 2) { drawing = false; return; }
      drawing = false;
      sendStroke({
        points: currentPoints,
        color,
        size,
        tool
      });
      currentPoints = [];
    }

    canvas.addEventListener("mousedown", start);
    canvas.addEventListener("mousemove", draw);
    canvas.addEventListener("mouseup", end);
    canvas.addEventListener("mouseleave", end);
    canvas.addEventListener("touchstart", start, { passive: false });
    canvas.addEventListener("touchmove", draw, { passive: false });
    canvas.addEventListener("touchend", end);
    canvas.addEventListener("touchcancel", end);

    document.getElementById("pen").onclick = () => {
      tool = "pen";
      document.getElementById("pen").classList.add("active");
      document.getElementById("eraser").classList.remove("active");
    };
    document.getElementById("eraser").onclick = () => {
      tool = "eraser";
      document.getElementById("eraser").classList.add("active");
      document.getElementById("pen").classList.remove("active");
    };
    document.getElementById("clear").onclick = () => {
      sendClear();
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    };
    document.getElementById("color").oninput = (e) => { color = e.target.value; };
    document.getElementById("size").oninput = (e) => { size = +e.target.value; };

    function drawRemoteStroke(stroke) {
      if (!stroke.points || stroke.points.length < 2) return;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.lineWidth = stroke.tool === "eraser" ? (stroke.size || 6) * 3 : (stroke.size || 6);
      ctx.strokeStyle = stroke.tool === "eraser" ? "#ffffff" : (stroke.color || "#000");
      ctx.beginPath();
      ctx.moveTo(stroke.points[0].x * canvas.width, stroke.points[0].y * canvas.height);
      for (let i = 1; i < stroke.points.length; i++) {
        ctx.lineTo(stroke.points[i].x * canvas.width, stroke.points[i].y * canvas.height);
      }
      ctx.stroke();
    }
  </script>
</body>
</html>
