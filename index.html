<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>SketchParty</title>
  <script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0a0a0a;
      color: #fff;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      touch-action: none;
      overflow: hidden;
    }
    header {
      padding: 8px 12px;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }
    h1 { font-size: 1rem; font-weight: 600; }
    .tools { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    button, input[type="color"], input[type="text"] {
      background: #2a2a2a;
      border: 1px solid #444;
      color: #fff;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    button.active { background: #3b82f6; border-color: #3b82f6; }
    canvas { flex: 1; background: #fff; touch-action: none; width: 100%; }
    .screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      gap: 12px;
      text-align: center;
    }
    .screen input { width: 220px; font-size: 1.2rem; text-align: center; letter-spacing: 2px; }
    #qrcode { background: #fff; padding: 12px; border-radius: 12px; }
    #players { opacity: 0.85; margin-top: 8px; }
    .role-badge {
      background: #1f2937;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>SketchParty</h1>
    <div class="tools" id="tools" style="display:none;">
      <button id="pen" class="active">Pen</button>
      <button id="eraser">Eraser</button>
      <button id="clear">Clear</button>
      <input type="color" id="color" value="#000000">
      <input type="range" id="size" min="2" max="20" value="6">
    </div>
    <div id="status" class="role-badge">Ready</div>
  </header>

  <!-- Home: Host or Join -->
  <div class="screen" id="homeScreen">
    <h2>SketchParty</h2>
    <p style="opacity:.7;">Host on the TV (or APK). Everyone else joins with their phone.</p>
    <button id="hostBtn">Host a Room</button>
    <hr style="width:60%;border:none;border-top:1px solid #333;margin:8px 0;">
    <input id="nameInput" placeholder="Your name" value="Player">
    <input id="codeInput" placeholder="ROOM CODE" maxlength="6" style="text-transform:uppercase;">
    <button id="joinBtn">Join Room</button>
    <p id="joinError" style="color:#f87171;"></p>
  </div>

  <!-- Host lobby with QR -->
  <div class="screen" id="lobbyScreen" style="display:none;">
    <h2>Scan to Join</h2>
    <div id="qrcode"></div>
    <p style="font-size:1.5rem;">Code: <strong id="codeDisplay"></strong></p>
    <div id="players">Waiting for players…</div>
    <button id="showBoardBtn">Show Drawing Board</button>
  </div>

  <!-- Shared live canvas (host always sees it; players see it when not drawing or always as view) -->
  <canvas id="canvas" style="display:none;"></canvas>

  <script type="module">
    import { createHost, joinAsPlayer, sendStroke, sendClear } from "./js/game.js";

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const homeScreen = document.getElementById("homeScreen");
    const lobbyScreen = document.getElementById("lobbyScreen");
    const tools = document.getElementById("tools");
    const statusEl = document.getElementById("status");

    let isHost = false;
    let canDraw = false; // true when it's your turn (for now, host + joined players can draw)
    let drawing = false;
    let tool = "pen";
    let color = "#000000";
    let size = 6;
    let currentPoints = [];

    function resize() {
      const header = document.querySelector("header");
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight - header.offsetHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    // Auto-join if QR brought us here with ?room=
    const params = new URLSearchParams(location.search);
    const urlCode = params.get("room");
    if (urlCode) {
      document.getElementById("codeInput").value = urlCode;
      // Optional: auto-focus name or auto-join later
    }

    // --- Host ---
    document.getElementById("hostBtn").onclick = () => {
      isHost = true;
      canDraw = true; // host can draw too if desired
      homeScreen.style.display = "none";
      lobbyScreen.style.display = "flex";
      statusEl.textContent = "Hosting";

      createHost(
        (code) => {
          document.getElementById("codeDisplay").textContent = code;
          const joinUrl = new URL(window.location.href);
          joinUrl.searchParams.set("room", code);
          new QRCode(document.getElementById("qrcode"), {
            text: joinUrl.toString(),
            width: 220,
            height: 220
          });
        },
        (names) => {
          document.getElementById("players").textContent = names.length
            ? "Joined: " + names.join(", ")
            : "Waiting for players…";
        },
        handleIncomingStroke
      );
    };

    document.getElementById("showBoardBtn").onclick = () => {
      lobbyScreen.style.display = "none";
      canvas.style.display = "block";
      tools.style.display = canDraw ? "flex" : "none";
      statusEl.textContent = canDraw ? "Drawing" : "Watching";
    };

    // --- Join ---
    document.getElementById("joinBtn").onclick = () => {
      const name = document.getElementById("nameInput").value || "Player";
      const code = document.getElementById("codeInput").value;
      if (!code) {
        document.getElementById("joinError").textContent = "Enter a room code.";
        return;
      }

      joinAsPlayer(
        code,
        name,
        () => {
          homeScreen.style.display = "none";
          canvas.style.display = "block";
          // For now everyone who joins can draw. Later restrict to current drawer.
          canDraw = true;
          tools.style.display = "flex";
          statusEl.textContent = "Drawing";
        },
        handleIncomingStroke,
        () => {}
      );
    };

    function handleIncomingStroke(data) {
      if (data.type === "clear") {
        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        return;
      }
      drawRemoteStroke(data);
    }

    function getNormPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: (clientX - rect.left) / canvas.width,
        y: (clientY - rect.top) / canvas.height
      };
    }

    function start(e) {
      if (!canDraw) return;
      e.preventDefault();
      drawing = true;
      currentPoints = [getNormPos(e)];
      ctx.beginPath();
      const p = currentPoints[0];
      ctx.moveTo(p.x * canvas.width, p.y * canvas.height);
    }

    function draw(e) {
      if (!drawing || !canDraw) return;
      e.preventDefault();
      const p = getNormPos(e);
      currentPoints.push(p);
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.lineWidth = tool === "eraser" ? size * 3 : size;
      ctx.strokeStyle = tool === "eraser" ? "#ffffff" : color;
      ctx.lineTo(p.x * canvas.width, p.y * canvas.height);
      ctx.stroke();
    }

    function end() {
      if (!drawing || currentPoints.length < 2) { drawing = false; return; }
      drawing = false;
      sendStroke({ points: currentPoints, color, size, tool });
      currentPoints = [];
    }

    canvas.addEventListener("mousedown", start);
    canvas.addEventListener("mousemove", draw);
    canvas.addEventListener("mouseup", end);
    canvas.addEventListener("mouseleave", end);
    canvas.addEventListener("touchstart", start, { passive: false });
    canvas.addEventListener("touchmove", draw, { passive: false });
    canvas.addEventListener("touchend", end);
    canvas.addEventListener("touchcancel", end);

    document.getElementById("pen").onclick = () => {
      tool = "pen";
      document.getElementById("pen").classList.add("active");
      document.getElementById("eraser").classList.remove("active");
    };
    document.getElementById("eraser").onclick = () => {
      tool = "eraser";
      document.getElementById("eraser").classList.add("active");
      document.getElementById("pen").classList.remove("active");
    };
    document.getElementById("clear").onclick = () => {
      sendClear();
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    };
    document.getElementById("color").oninput = (e) => { color = e.target.value; };
    document.getElementById("size").oninput = (e) => { size = +e.target.value; };

    function drawRemoteStroke(stroke) {
      if (!stroke.points || stroke.points.length < 2) return;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.lineWidth = stroke.tool === "eraser" ? (stroke.size || 6) * 3 : (stroke.size || 6);
      ctx.strokeStyle = stroke.tool === "eraser" ? "#ffffff" : (stroke.color || "#000");
      ctx.beginPath();
      ctx.moveTo(stroke.points[0].x * canvas.width, stroke.points[0].y * canvas.height);
      for (let i = 1; i < stroke.points.length; i++) {
        ctx.lineTo(stroke.points[i].x * canvas.width, stroke.points[i].y * canvas.height);
      }
      ctx.stroke();
    }
  </script>
</body>
</html>
